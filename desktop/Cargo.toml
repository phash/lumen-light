[workspace]
resolver = "3"
# Ruling R2: vorerst nur crates/*; tools/* kommt mit Task 4. spikes/* bleiben draussen.
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
license = "CDDL-1.0"
publish = false

[workspace.dependencies]
libraw-sys = { path = "crates/libraw-sys" }
thiserror = "=2.0.21"
serde_json = "=1.0.154"
cc = { version = "=1.12.0", features = ["parallel"] }
bindgen = "=0.73.2"

# Abhaengigkeiten auch im Debug-Profil optimiert bauen (Decode-Tests sonst traege).
[profile.dev.package."*"]
opt-level = 3
