[workspace]
resolver = "3"
# Ruling R2: crates/* und tools/*. spikes/* bleiben draussen.
members = ["crates/*", "tools/*"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
libraw-sys = { path = "crates/libraw-sys" }
lumen-raw = { path = "crates/lumen-raw" }
lumen-gpu = { path = "crates/lumen-gpu" }
thiserror = "=2.0.21"
serde_json = "=1.0.154"
cc = { version = "=1.12.0", features = ["parallel"] }
bindgen = "=0.73.2"
wgpu = "=30.0.2"
bytemuck = { version = "=1.25.2", features = ["derive"] }
pollster = "=1.0.3"
png = "=0.18.1"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.2.3"
semver = { version = "=1.0.28", features = ["serde"] }
unicode-security = "=0.1.3"
sha2 = "=0.11.2"
ed25519-dalek = "=3.0.0"
base64 = "=0.23.1"
schemars = { version = "=1.2.3", features = ["semver1"] }

# Abhaengigkeiten auch im Debug-Profil optimiert bauen (Decode-Tests sonst traege).
[profile.dev.package."*"]
opt-level = 3
