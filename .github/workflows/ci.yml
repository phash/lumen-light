name: CI

# Pflicht-Checks pro PR + push auf main:
#   - Frontend: lint, typecheck, vitest (mit Coverage), build
#   - Backend:  pytest (mit testcontainers fuer Postgres + Garage-S3 + Keycloak,
#               inkl. Coverage-Report).
# E2E (Playwright) laeuft NICHT hier (Stack-Boot dauert) — siehe die eigene
# Workflow-Datei .github/workflows/e2e.yml (nightly cron + workflow_dispatch).
#
# Sicherheitshinweis: keine Verwendung von nutzergesteuerten Inputs
# (issue-titles, PR-bodies etc.) in run-Commands — alle Werte sind
# entweder konstant oder Secrets via env.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-Privilege fuer GITHUB_TOKEN: Workflows lesen nur den Code.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc -b --noEmit

      - name: Tests (mit Coverage)
        run: pnpm run test:coverage

      - name: Build
        run: pnpm build
        env:
          VITE_KEYCLOAK_AUTHORITY: http://placeholder
          VITE_KEYCLOAK_CLIENT_ID: placeholder
          VITE_API_BASE: http://placeholder/api/v1

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest (mit Coverage)
        run: .venv/bin/pytest -q --cov=app --cov-report=term-missing
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
