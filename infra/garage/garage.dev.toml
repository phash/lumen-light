# Garage-Konfiguration fuer Dev-Compose und pytest (Single-Node, sqlite).
# NUR lokal: rpc_secret und admin_token sind feste Test-Werte.
# Production nutzt deployment/garage.toml (aus garage.toml.example, eigene Secrets).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "1ec0de5ec2e7a11d00000000000000000000000000000000000000000000beef"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "lumen-dev-admin-token"
