# Lokaler Dev-Stack: Postgres + Keycloak + RustFS (S3-Stand-in).
# Lumen-Backend + Frontend laufen NICHT hier (Issuer-Matching macht das
# friemelig — kommt in Iteration 7 als Production-Deploy).
#
# Aufruf:
#   docker compose -f deployment/docker-compose.dev.yml up -d
# dann:
#   cd backend && uvicorn app.main:app --reload --port 8000
#   cd frontend && npm run dev
#
# Ports nur auf 127.0.0.1 (Default-Credentials sollen nicht im LAN haengen).
# Default-Admins (NICHT in Production verwenden):
#   Keycloak: admin / admin
#   S3:       minioadmin / minioadmin (RustFS)

services:
  postgres:
    image: postgres:16-alpine
    container_name: lumen-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen
      POSTGRES_DB: lumen
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - lumen_dev_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: lumen-dev-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:19000:9000"
    volumes:
      - ../infra/keycloak/lumen-realm.json:/opt/keycloak/data/import/realm.json:ro

  # S3-Stand-in. MinIO-Community-Images sind seit 2025 nicht mehr oeffentlich
  # pullbar -> RustFS (S3-kompatibel, gleicher Port 9000). Credentials bleiben
  # minioadmin/minioadmin, damit bestehende .env.local/Docs weiter passen.
  # Garage wie in Production (dxflrs/garage, Single-Node). S3 auf
  # localhost:9000 (Container 3900), damit Backend-Env und Doku gleich bleiben.
  s3:
    image: dxflrs/garage:v2.4.1
    container_name: lumen-dev-s3
    restart: unless-stopped
    command: ["/garage", "-c", "/etc/garage.toml", "server"]
    ports:
      - "127.0.0.1:9000:3900"
    volumes:
      - ../infra/garage/garage.dev.toml:/etc/garage.toml:ro
      - lumen_dev_s3_meta:/var/lib/garage/meta
      - lumen_dev_s3_data:/var/lib/garage/data

  # Layout + Key + Bucket ueber die Admin-API (gleiches Script wie Prod/pytest).
  # Dev-Key bekommt Owner-Recht, damit s3-cors die Bucket-CORS setzen darf.
  s3-init:
    image: python:3.12-alpine
    depends_on:
      - s3
    command: ["python", "/garage_init.py"]
    environment:
      GARAGE_ADMIN_URL: http://s3:3903
      GARAGE_ADMIN_TOKEN: lumen-dev-admin-token
      GARAGE_S3_BUCKET: lumen-images
      GARAGE_S3_ACCESS_KEY_ID: GKde7000000000000000000001
      GARAGE_S3_SECRET_ACCESS_KEY: de70000000000000000000000000000000000000000000000000000000000001
      GARAGE_KEY_OWNER: "1"
    volumes:
      - ../backend/scripts/garage_init.py:/garage_init.py:ro

  # Browser (Vite :5173) laedt per Pre-Signed POST/GET direkt nach :9000 -> CORS.
  s3-cors:
    image: amazon/aws-cli:2.38.5
    depends_on:
      s3-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: GKde7000000000000000000001
      AWS_SECRET_ACCESS_KEY: de70000000000000000000000000000000000000000000000000000000000001
      AWS_DEFAULT_REGION: garage
    entrypoint: >
      /bin/sh -c "
        aws --endpoint-url http://s3:3900 s3api put-bucket-cors --bucket lumen-images --cors-configuration '{\"CORSRules\":[{\"AllowedOrigins\":[\"http://localhost:5173\",\"http://127.0.0.1:5173\"],\"AllowedMethods\":[\"GET\",\"POST\",\"HEAD\"],\"AllowedHeaders\":[\"*\"],\"MaxAgeSeconds\":3600}]}' &&
        echo 'Bucket lumen-images bereit (CORS gesetzt).';
      "

volumes:
  lumen_dev_pg:
  lumen_dev_s3_data:
  lumen_dev_s3_meta:
