# Lokaler Dev-Stack: Postgres + Keycloak + RustFS (S3-Stand-in).
# Lumen-Backend + Frontend laufen NICHT hier (Issuer-Matching macht das
# friemelig — kommt in Iteration 7 als Production-Deploy).
#
# Aufruf:
#   docker compose -f deployment/docker-compose.dev.yml up -d
# dann:
#   cd backend && uvicorn app.main:app --reload --port 8000
#   cd frontend && npm run dev
#
# Ports nur auf 127.0.0.1 (Default-Credentials sollen nicht im LAN haengen).
# Default-Admins (NICHT in Production verwenden):
#   Keycloak: admin / admin
#   S3:       minioadmin / minioadmin (RustFS)

services:
  postgres:
    image: postgres:16-alpine
    container_name: lumen-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen
      POSTGRES_DB: lumen
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - lumen_dev_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: lumen-dev-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:19000:9000"
    volumes:
      - ../infra/keycloak/lumen-realm.json:/opt/keycloak/data/import/realm.json:ro

  # S3-Stand-in. MinIO-Community-Images sind seit 2025 nicht mehr oeffentlich
  # pullbar -> RustFS (S3-kompatibel, gleicher Port 9000). Credentials bleiben
  # minioadmin/minioadmin, damit bestehende .env.local/Docs weiter passen.
  s3:
    image: rustfs/rustfs:1.0.4
    container_name: lumen-dev-s3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - lumen_dev_s3:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health || wget -q -O /dev/null http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  s3-init:
    image: amazon/aws-cli:2.38.5
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
        aws --endpoint-url http://s3:9000 s3api head-bucket --bucket lumen-images 2>/dev/null ||
        aws --endpoint-url http://s3:9000 s3api create-bucket --bucket lumen-images;
        aws --endpoint-url http://s3:9000 s3api put-bucket-cors --bucket lumen-images --cors-configuration '{\"CORSRules\":[{\"AllowedOrigins\":[\"http://localhost:5173\",\"http://127.0.0.1:5173\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"HEAD\"],\"AllowedHeaders\":[\"*\"],\"MaxAgeSeconds\":3600}]}';
        echo 'Bucket lumen-images bereit.';
      "

volumes:
  lumen_dev_pg:
  lumen_dev_s3:
