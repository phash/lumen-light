server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip-Kompression fuer textbasierte Assets
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- Interner Edge-Proxy (Netztrennung, Security-Review 2026-10) ---
    # Nur lumen-web haengt im cluster-geteilten caddy-proxy-Netz. API,
    # Keycloak und Garage sind ausschliesslich im lumen-internal-Netz und
    # damit fuer fremde Container im Cluster unerreichbar; Caddy erreicht sie
    # nur ueber diesen nginx. Pfad-Policies (Admin-Konsole 404, Body-Limits,
    # CSP) bleiben im Caddy-Block (infra/caddy/lumen.caddyfile).
    #
    # Upstreams ueber Variablen + Docker-DNS: nginx startet auch, wenn die
    # Hosts (noch) nicht aufloesbar sind (lokaler Image-Build, Neustart-
    # Reihenfolge) und loest nach Container-Recreate neu auf.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $lumen_api lumen-api:4100;
    set $lumen_kc lumen-keycloak:8080;
    set $lumen_s3 lumen-garage:3900;

    # Original-Host + Caddys X-Forwarded-* unveraendert durchreichen: SigV4-
    # Signatur der Pre-Signed GETs haengt am Host, Keycloak (KC_PROXY_HEADERS=
    # xforwarded) und uvicorn (--proxy-headers) lesen Client-IP/Proto daraus.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_set_header Connection "";

    # Defense-in-Depth: dieselben Pfad-Policies wie im Caddy-Block, denn
    # fremde Container im caddy-proxy-Netz erreichen lumen-web:80 direkt
    # (ohne Caddy). Schema-Docs -> 404 (Keycloak-Admin siehe /auth/).
    location ~ ^/(docs|redoc)(/|$)|^/openapi\.json$ {
        return 404;
    }

    location ^~ /api/ {
        client_max_body_size 2m;
        proxy_pass http://$lumen_api;
    }

    location ^~ /auth/ {
        client_max_body_size 1m;
        # Keycloak-Antworten tragen grosse Set-Cookie-/Location-Header.
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        # Master-Realm + Admin-Konsolen nie ausliefern (wie Caddy). Verschachtelt,
        # weil ^~ die Regex-Locations auf Server-Ebene abschaltet.
        location ~ ^/auth/(realms/master(/|$)|admin/master/|admin/realms/master(/|$)|admin/[^/]+/console(/|$)) {
            return 404;
        }
        proxy_pass http://$lumen_kc;
    }

    # Garage S3 (Pre-Signed POST/GET, Path-Style, Bucket = erster Pfadteil).
    # Bild-Uploads bis MAX_IMAGE_SIZE_BYTES (200 MB) + Formular-Overhead
    # streamen ungepuffert durch; die Groesse erzwingt die POST-Policy.
    # Ohne abschliessenden Slash: Pre-Signed POST geht an /lumen-images (Bucket-URL).
    location ^~ /lumen-images {
        client_max_body_size 210m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Nur Pre-Signed POST/GET werden ausgegeben (wie im Caddy-Block).
        limit_except GET POST {
            deny all;
        }
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://$lumen_s3;
    }

    # Bekannte Scan-/Junk-Pfade hart auf 404 statt SPA-Fallback (200 +
    # index.html) — vermeidet Soft-404s und gibt Scannern keinen 200.
    location ~* (\.php$|\.env$|/\.git|/wp-) {
        return 404;
    }

    # SPA-Fallback: alle nicht existierenden Pfade -> index.html.
    # $uri.html liefert prerenderte Flat-Files (z. B. /datenschutz ->
    # datenschutz.html) OHNE 301-Trailing-Slash-Redirect; Canonical bleibt
    # so deckungsgleich mit der ausgelieferten URL.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Statische Assets aggressiv cachen — sind hash-getaggt
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # config.js NICHT cachen — soll zur Run-Time aktualisierbar sein
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # index.html nicht cachen — laedt config.js + neueste Asset-Hashes
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
}
